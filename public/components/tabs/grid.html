<div id="gridViewContainer" class="ios-card p-4">
    <div class="flex items-center justify-between mb-4 relative min-h-[50px]">
        <button onclick="changeMonth(-1)"
            class="absolute left-0 top-1/2 -translate-y-1/2 text-blue-500 text-3xl font-bold p-2 active:scale-90 transition-transform">‹</button>
        <div class="flex flex-col items-center justify-center w-full">
            <h2 id="gridTitle" class="font-bold text-xl capitalize leading-tight"></h2>
            <button id="inlineEditBtn" onclick="toggleEditor()"
                class="hidden bg-blue-50 text-blue-500 font-bold text-[10px] uppercase px-3 py-1 rounded-full border border-blue-200 mt-1 active:scale-95 transition-transform shadow-sm">🖍
                Редагувати графік</button>
        </div>
        <button onclick="changeMonth(1)"
            class="absolute right-0 top-1/2 -translate-y-1/2 text-blue-500 text-3xl font-bold p-2 active:scale-90 transition-transform">›</button>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-2 mb-4">
        <div id="pdfExportBtnWrapper" class="hidden">
            <button onclick="window.exportCurrentMonthPdf()"
                class="text-[10px] bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 active:scale-95 transition-transform shadow-sm">
                <span>📥</span> PDF
            </button>
        </div>
        <div id="sheetsSyncBtnWrapper" class="hidden flex flex-wrap items-center gap-1.5">
            <button onclick="window.syncSheetsSchedule('sync')" title="Оновити графік з Google Таблиці (пошук різниці)"
                class="text-[10px] bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 font-bold px-2.5 py-1.5 rounded-lg border border-emerald-200 dark:border-emerald-800 flex items-center gap-1 active:scale-95 transition-transform shadow-sm">
                <span>🔄</span> Оновити з таблиці
            </button>
            <button onclick="window.syncSheetsSchedule('reload')" title="Повністю перезаписати графік за цей місяць з Google Таблиці"
                class="text-[10px] bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-300 font-bold px-2.5 py-1.5 rounded-lg border border-blue-200 dark:border-blue-800 flex items-center gap-1 active:scale-95 transition-transform shadow-sm">
                <span>📥</span> Завантажити графік
            </button>
            <button onclick="window.rollbackSheetsSchedule()" title="Відмінити останні зміни та повернути попередній графік"
                class="text-[10px] bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-300 font-bold px-2 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center gap-1 active:scale-95 transition-transform shadow-sm">
                <span>↩️</span> Відмінити
            </button>
        </div>
    </div>

    <div class="flex justify-between items-center mb-2 px-2">
        <div id="substitutesFilterWrapper" class="hidden">
            <label class="flex items-center gap-1 text-[10px] text-gray-500 font-medium cursor-pointer">
                <input type="checkbox" id="hideSubstitutesCheckbox" onchange="window.toggleHideSubstitutes(this)" class="w-3 h-3 rounded border-gray-300">
                Приховати підміни
            </label>
        </div>
        <button id="toggleHoursPinBtn" onclick="toggleHoursPin()"
            class="text-[10px] text-gray-500 bg-gray-100 dark:bg-[#2C2C2E] px-2 py-1 rounded-lg font-medium flex items-center gap-1 active:scale-95 transition-transform ml-auto">
            <span>📌</span> Закріпити години
        </button>
    </div>

    <div class="overflow-x-auto pb-3 -mx-4 px-4 custom-scrollbar" id="gridViewTable" style="-webkit-overflow-scrolling: touch;">
    </div>


</div>
